<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fraud Detection Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #e5edf8;
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .subtitle { color: #adbed5; line-height: 1.5; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 30px 0;
    }

    .card {
      background: #1d2b42;
      padding: 24px;
      border-radius: 12px;
      flex: 1;
      min-width: 180px;
    }

    .number {
      display: block;
      font-size: 36px;
      font-weight: bold;
      margin-top: 12px;
    }

    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 14px;
      border-bottom: 1px solid #34435b;
      white-space: nowrap;
    }

    .review { color: #ffba86; }
    #status { color: #adbed5; }
  </style>
</head>

<body>
  <h1>Fraud Detection Dashboard</h1>

  <p class="subtitle">
    Simulated transaction monitoring · Latest 100 predictions<br>
    Scores are model outputs; flagged transactions need review.
  </p>

  <div class="cards">
    <div class="card">
      Transactions displayed
      <span class="number" id="total">0</span>
    </div>

    <div class="card">
      Flagged for review
      <span class="number" id="flagged">0</span>
    </div>

    <div class="card">
      Passed
      <span class="number" id="passed">0</span>
    </div>
  </div>

  <p id="status" role="status">Connecting...</p>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Time (local)</th>
          <th>Amount</th>
          <th>Model score</th>
          <th>Decision</th>
        </tr>
      </thead>
      <tbody id="transactions"></tbody>
    </table>
  </div>

  <script>
    async function refreshDashboard() {
      const status = document.getElementById("status");

      try {
        const response = await fetch("/transactions");

        if (!response.ok) {
          throw new Error("Could not load transactions");
        }

        const data = await response.json();
        const flagged = data.filter(
          transaction => transaction.decision === "REVIEW"
        ).length;

        document.getElementById("total").textContent = data.length;
        document.getElementById("flagged").textContent = flagged;
        document.getElementById("passed").textContent =
          data.length - flagged;

        const table = document.getElementById("transactions");
        table.replaceChildren();

        for (const transaction of data) {
          const row = document.createElement("tr");

          if (transaction.decision === "REVIEW") {
            row.className = "review";
          }

          const values = [
            transaction.id,
            new Date(transaction.timestamp).toLocaleString(),
            Number(transaction.amount).toFixed(2),
            Number(transaction.fraud_score).toFixed(3),
            transaction.decision
          ];

          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          }

          table.appendChild(row);
        }

        status.textContent =
          "Connected · Updated " + new Date().toLocaleTimeString();
      } catch (error) {
        status.textContent =
          "Connection failed — displayed data may be stale. " +
          "Check that the API is running.";
      } finally {
        setTimeout(refreshDashboard, 2000);
      }
    }

    refreshDashboard();
  </script>
</body>
</html>
